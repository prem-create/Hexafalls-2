name: walking_eye
description: Walking Eye - AI Perception Frontend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.10.5+9

  # Text to Speech
  flutter_tts: ^4.0.2

  # HTTP
  http: ^1.2.1
  http_parser: ^4.0.2

  # Image picking (gallery fallback)
  image_picker: ^1.1.2

  # YUV -> JPEG conversion for camera stream frames
  image: ^4.1.7

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true